<text x="365" y="502" font-family="Arial" font-size="28" fill="#183345">CRM C01 → Control C04 · bitácora RECIBIDA</text>
<text x="365" y="547" font-family="Arial" font-size="24" fill="#286d9b" font-weight="700">Permisos e idempotencia antes de evaluar</text>
