<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1840" viewBox="0 0 1900 1840" role="img" aria-labelledby="title description">
<title id="title">Eventos de la arquitectura integrada CRM ERP</title>
<desc id="description">La aceptación de la cotización precede a la solicitud. C04 registra recepción y decisión. Tres variantes independientes: validación, disponibilidad parcial y descuento sin aprobación. El arnés documenta REP-EP-001 como señal conceptual hacia P2P. El reintento recupera la respuesta original.</desc>
<rect width="1900" height="1840" fill="#ffffff"/>
<text x="55" y="65" font-family="Arial" font-size="48" fill="#16374c" font-weight="700">Eventos de la arquitectura integrada</text>
<text x="55" y="112" font-family="Arial" font-size="30" fill="#526574">Cliente nuevo en tienda física · Odoo propuesto · solicitud y respuesta</text>
