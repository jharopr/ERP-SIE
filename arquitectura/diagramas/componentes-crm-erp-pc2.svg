  <text x="825" y="567" class="tag" font-family="Arial,sans-serif" fill="#152c46" font-size="15px">«extensión propuesta · no instalada»</text>
  <text x="825" y="603" class="head" font-family="Arial,sans-serif" fill="#152c46" font-size="23px" font-weight="700">C04 · Control de transición</text>
  <text x="825" y="635" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">mys.crm.transition · contrato 1.0</text>
  <text x="825" y="666" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">Valida referencias, vigencia y autorizaciones</text>
  <text x="825" y="697" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">Idempotencia + unicidad por cotización/versión</text>
  <text x="825" y="730" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">ACEPTADA / RECHAZADA</text>
  <text x="825" y="778" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">PC2 no confirma pedido · order_id = null</text>
  <path d="M1030 400 V535" class="flow" fill="none" stroke="#355477" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="1050" y="455" class="label" font-family="Arial,sans-serif" fill="#152c46" font-size="17px" font-weight="700">I03 · solicitud / consulta</text>
  <text x="1050" y="481" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Referencias → decisión trazable</text>
  <path d="M1230 535 V510 H1515 V400" class="flow" fill="none" stroke="#355477" stroke-width="2.5" marker-end="url(#arrow)" />
