  <rect x="40" y="705" width="250" height="110" rx="12" class="context" fill="#f4f6f9" stroke="#a3afbf" stroke-width="2" />
  <text x="60" y="740" class="head" font-family="Arial,sans-serif" fill="#152c46" font-size="23px" font-weight="700">Gerencia</text>
  <text x="60" y="772" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">Autoriza excepciones</text>
  <text x="60" y="798" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Sin autoaprobación</text>
  <path d="M290 760 H350 V850 H1515 V755" class="flow" fill="none" stroke="#355477" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="1310" y="836" width="360" height="26" fill="#fbfcff" />
  <text x="1320" y="855" class="label" font-family="Arial,sans-serif" fill="#152c46" font-size="17px" font-weight="700">Decisión humana registrada en C06</text>
  <path d="M1030 795 V920" class="flow" fill="none" stroke="#355477" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="1010" y="823" width="70" height="29" fill="#fbfcff" />
  <text x="1045" y="844" text-anchor="middle" class="label" font-family="Arial,sans-serif" fill="#152c46" font-size="17px" font-weight="700">I07</text>
  <rect x="395" y="920" width="1310" height="115" rx="12" class="proposed" fill="#fff5e3" stroke="#bd861f" stroke-width="2" />
  <text x="420" y="952" class="head" font-family="Arial,sans-serif" fill="#152c46" font-size="23px" font-weight="700">C07 · Seguridad y bitácora transversal</text>
  <text x="420" y="983" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">Sesión, grupos y reglas por compañía/registro · aplica a C01–C06 antes de acceder a datos</text>
  <text x="420" y="1013" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Auditoría específica propuesta: mys.transition.event · actor, interfaz, correlación, fecha y resultado sin datos sensibles</text>
  <path d="M1030 1035 V1090" class="orm" fill="none" stroke="#388366" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="1050" y="1070" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">C01–C07 → ORM → persistencia</text>
  <rect x="395" y="1090" width="1310" height="90" rx="12" fill="#eaf6ef" stroke="#4b8c6d" stroke-width="2" />
  <text x="420" y="1127" class="head" font-family="Arial,sans-serif" fill="#152c46" font-size="23px" font-weight="700">C08 · Persistencia de Odoo / PostgreSQL</text>
  <text x="420" y="1158" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">Maestros, snapshot, solicitud y eventos · restricciones únicas y transacción atómica por implementar en Odoo</text>
  <path d="M1705 330 H1735 V1260 H1515 V1290" class="later" fill="none" stroke="#8290a2" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#grayarrow)" />
  <text x="1300" y="1258" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Continuidad posterior a PC2</text>
  <rect x="395" y="1290" width="1310" height="88" rx="12" fill="#f6f7f9" stroke="#a3afbf" stroke-width="2" stroke-dasharray="9 7" />
  <text x="420" y="1324" class="head" font-family="Arial,sans-serif" fill="#152c46" font-size="23px" font-weight="700">Contexto PC1: Ventas → adaptador Odoo–UBLHUB → UBLHUB / ruta tributaria</text>
  <text x="420" y="1354" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">Pedido operativo, reservas, pago, facturación, entrega y posventa quedan fuera de la evaluación PC2.</text>
  <rect x="40" y="1410" width="24" height="20" rx="4" class="standard" fill="#edf4ff" stroke="#547eb3" stroke-width="2" />
  <text x="75" y="1427" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Componente estándar de referencia</text>
  <rect x="435" y="1410" width="24" height="20" rx="4" class="proposed" fill="#fff5e3" stroke="#bd861f" stroke-width="2" />
  <text x="470" y="1427" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Extensión o configuración propuesta</text>
  <text x="920" y="1427" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">I01–I07: especificación en arquitectura/contratos/crm-erp-v1.md</text>
  <text x="40" y="1461" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">No acredita instalación, permisos ni integración real. La simulación del contrato usa JSON + SQLite y conserva los mismos identificadores de interfaces.</text>
  <text x="825" y="753" font-family="Arial,sans-serif" font-size="16px" fill="#52627a">PROMESA_CONDICIONADA / PENDIENTE</text>
