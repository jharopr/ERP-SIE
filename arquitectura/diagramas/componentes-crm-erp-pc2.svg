  <text x="1345" y="705" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">mys.discount.approval</text>
  <text x="1345" y="734" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Aprobador, versión, importe y vigencia</text>
