<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1480" viewBox="0 0 1800 1480" role="img" aria-labelledby="title desc">
  <title id="title">PC2 · Componentes e interfaces de la transición CRM–ERP</title>
  <desc id="desc">Odoo propuesto, no instalado: CRM consulta Contactos y prepara cotizaciones en Ventas. Control de transición propuesto consulta Ventas, Inventario y Autorizaciones, con Seguridad y bitácora transversal. Interfaces I01 a I07. PostgreSQL se usa mediante ORM. WhatsApp es manual. UBLHUB queda fuera de PC2.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0 0 L9 4 L0 8Z" fill="#355477" />
    </marker>
    <marker id="grayarrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0 0 L9 4 L0 8Z" fill="#8290a2" />
    </marker>
  </defs>
  <rect width="1800" height="1480" fill="white" />
  <rect x="35" y="28" width="7" height="68" rx="3" fill="#246b89" />
  <text x="60" y="58" class="title" font-family="Arial,sans-serif" fill="#152c46" font-size="34px" font-weight="700">Arquitectura CRM–ERP · componentes e interfaces</text>
  <text x="60" y="91" class="subtitle" font-family="Arial,sans-serif" fill="#152c46" font-size="19px">Grupo 7 · MYS Hermanos · PC2 v2.0 · Diseño propuesto y simulación local · 15/10/2026</text>
  <rect x="330" y="145" width="1430" height="1080" rx="18" class="zone" fill="#fbfcff" stroke="#9aaec6" stroke-width="2" />
  <text x="360" y="183" class="head" font-family="Arial,sans-serif" fill="#152c46" font-size="23px" font-weight="700">Plataforma Odoo · frontera entre módulos, sin API comercial externa</text>
  <text x="360" y="208" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Cada flecha identifica al consumidor y al proveedor de una interfaz; incluye la respuesta.</text>
  <rect x="40" y="260" width="250" height="135" rx="12" class="context" fill="#f4f6f9" stroke="#a3afbf" stroke-width="2" />
  <text x="60" y="291" class="head" font-family="Arial,sans-serif" fill="#152c46" font-size="23px" font-weight="700">Cliente / WhatsApp</text>
  <text x="60" y="320" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">Consulta por 5 autoradios</text>
  <text x="60" y="347" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Captación y datos didácticos</text>
  <text x="60" y="373" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Atención manual, sin conector</text>
  <rect x="40" y="475" width="250" height="125" rx="12" class="context" fill="#f4f6f9" stroke="#a3afbf" stroke-width="2" />
  <text x="60" y="510" class="head" font-family="Arial,sans-serif" fill="#152c46" font-size="23px" font-weight="700">Vendedor</text>
  <text x="60" y="542" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">Registro manual en CRM</text>
  <text x="60" y="572" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Identidad de sesión autorizada</text>
