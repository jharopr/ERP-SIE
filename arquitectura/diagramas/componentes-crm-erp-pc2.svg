  <text x="885" y="325" class="head" font-family="Arial,sans-serif" fill="#152c46" font-size="23px" font-weight="700">C01 · CRM</text>
  <text x="885" y="355" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">Lead / oportunidad · crm.lead</text>
  <text x="885" y="382" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Campaña, fuente y atención</text>
  <rect x="1325" y="265" width="380" height="135" rx="12" class="standard" fill="#edf4ff" stroke="#547eb3" stroke-width="2" />
  <text x="1345" y="292" class="tag" font-family="Arial,sans-serif" fill="#152c46" font-size="15px">«estándar + extensión de versión/aceptación»</text>
