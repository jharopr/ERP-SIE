<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1440" viewBox="0 0 1300 1440" role="img" aria-labelledby="title desc">
<title id="title">Componentes de Odoo y sistemas externos · PC2</title>
<desc id="desc">WhatsApp es un canal manual. CRM, Contactos, Ventas e Inventario están dentro de Odoo. Ventas devuelve estado y acción a CRM. El adaptador, UBLHUB y SUNAT son continuidad de PC1 fuera de PC2.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172b40}.h{font-size:32px;font-weight:bold}.name{font-size:28px;font-weight:bold}.body{font-size:23px}.small{font-size:21px}.label{font-size:22px;font-weight:bold}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.future{stroke-dasharray:8 7}.card{stroke:#64748b;stroke-width:2;rx:14}.external{fill:#f1f5f9}.odoo{fill:#fafcfe;stroke:#52728c;stroke-width:2.5}.crm{fill:#e6f0fb}.erp{fill:#e8f4ef}</style>
<rect width="1300" height="1440" fill="white"/>
<text x="70" y="62" class="h">Arquitectura de componentes · PC2</text>
<text x="70" y="102" class="body">Fuente comercial → oportunidad → cotización → solicitud y respuesta</text>
<rect x="70" y="155" width="330" height="120" class="card external"/>
<text x="95" y="194" class="name">WhatsApp móvil</text><text x="95" y="229" class="small">Canal externo de consulta</text><text x="95" y="256" class="small">Atención por una persona</text>
<rect x="500" y="155" width="300" height="120" class="card external"/>
<text x="650" y="211" text-anchor="middle" class="name">Vendedor</text><text x="650" y="249" text-anchor="middle" class="small">Actor de negocio</text>
<rect x="910" y="155" width="300" height="120" class="card external"/>
<text x="1060" y="211" text-anchor="middle" class="name">Gerencia</text><text x="1060" y="249" text-anchor="middle" class="small">Actor de aprobación</text>
<path d="M400 215 H500" class="line"/>
<rect x="70" y="350" width="1140" height="735" rx="20" class="odoo"/>
<text x="100" y="392" class="name">ODOO · módulos de la propuesta PC2</text>
<rect x="500" y="430" width="300" height="130" class="card crm"/>
<text x="650" y="474" text-anchor="middle" class="name">CRM</text><text x="650" y="510" text-anchor="middle" class="body">Lead y oportunidad</text><text x="650" y="541" text-anchor="middle" class="small">Contexto y seguimiento</text>
<path d="M650 275 V430" class="line"/><text x="670" y="329" class="small">Registro manual</text>
<rect x="500" y="685" width="300" height="145" class="card erp"/>
<text x="650" y="725" text-anchor="middle" class="name">Ventas</text><text x="650" y="759" text-anchor="middle" class="body">Cotización y solicitud</text><text x="650" y="791" text-anchor="middle" class="small">Validación y aprobación</text><text x="650" y="817" text-anchor="middle" class="small">como funciones internas</text>
<path d="M605 560 V685" class="line"/><text x="580" y="607" text-anchor="end" class="label">I02 / I03</text><text x="580" y="640" text-anchor="end" class="small">Cotizar / solicitar</text>
<path d="M695 685 V560" class="line"/><text x="720" y="607" class="label">I08 · respuesta</text><text x="720" y="640" class="small">Estado, causa y acción</text>
<path d="M1060 275 V755 H800" class="line"/><text x="1084" y="490" transform="rotate(90 1084 490)" class="small">Autorizar excepción comercial</text>
<rect x="120" y="910" width="330" height="115" class="card erp"/>
<text x="285" y="956" text-anchor="middle" class="name">Contactos</text><text x="285" y="994" text-anchor="middle" class="small">Identidad y canal autorizado</text>
<rect x="840" y="910" width="330" height="115" class="card erp"/>
<text x="1005" y="956" text-anchor="middle" class="name">Inventario</text><text x="1005" y="994" text-anchor="middle" class="small">Disponibilidad por SKU</text>
<path d="M500 755 H285 V910" class="line"/><text x="305" y="867" class="small">Cliente validado</text>
<path d="M500 485 H180 V910" class="line"/><text x="202" y="608" class="label">I01 · resolver cliente</text>
<path d="M800 795 H1005 V910" class="line"/><text x="1025" y="867" class="small">I05 · stock</text>
<text x="650" y="1063" text-anchor="middle" class="small">Funciones internas: snapshot (I04), aprobación (I06), permisos y trazabilidad (I07)</text>
<rect x="70" y="1150" width="1140" height="225" rx="20" class="card external future"/>
<text x="100" y="1194" class="name">Continuidad de PC1 · fuera del tramo PC2</text>
<rect x="120" y="1230" width="330" height="100" class="card external"/>
<text x="285" y="1269" text-anchor="middle" class="label">Adaptador Odoo–UBLHUB</text><text x="285" y="1305" text-anchor="middle" class="small">Integración propia propuesta</text>
<rect x="525" y="1230" width="280" height="100" class="card external"/>
<text x="665" y="1269" text-anchor="middle" class="name">UBLHUB</text><text x="665" y="1305" text-anchor="middle" class="small">Emisión electrónica externa</text>
<rect x="900" y="1230" width="270" height="100" class="card external"/>
<text x="1035" y="1269" text-anchor="middle" class="name">SUNAT</text><text x="1035" y="1305" text-anchor="middle" class="small">Sistema externo tributario</text>
<path d="M500 795 H90 V1280 H120" class="line future"/><path d="M450 1280 H525" class="line future"/><path d="M805 1280 H900" class="line future"/>
<text x="70" y="1420" class="small">Línea continua: PC2 · línea discontinua: continuidad posterior · sin API de WhatsApp</text>
</svg>
