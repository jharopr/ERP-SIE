  <text x="1345" y="355" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">Cotización · sale.order / líneas</text>
  <text x="1345" y="382" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Dueño de precios, totales y futura confirmación</text>
  <path d="M865 330 H725" class="flow" fill="none" stroke="#355477" stroke-width="2.5" marker-end="url(#arrow)" />
