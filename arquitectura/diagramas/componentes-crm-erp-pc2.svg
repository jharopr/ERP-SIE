  <text x="1533" y="470" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Snapshot y aceptación</text>
  <rect x="395" y="610" width="330" height="145" rx="12" class="standard" fill="#edf4ff" stroke="#547eb3" stroke-width="2" />
  <text x="415" y="638" class="tag" font-family="Arial,sans-serif" fill="#152c46" font-size="15px">«componente estándar»</text>
  <text x="415" y="673" class="head" font-family="Arial,sans-serif" fill="#152c46" font-size="23px" font-weight="700">C05 · Inventario</text>
  <text x="415" y="705" class="body" font-family="Arial,sans-serif" fill="#152c46" font-size="18px">Disponibilidad por SKU y ubicación</text>
  <text x="415" y="734" class="small" font-family="Arial,sans-serif" fill="#152c46" font-size="16px">Lectura sin reserva ni salida</text>
