<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1160" viewBox="0 0 1900 1160" role="img" aria-labelledby="title description">
<title id="title">Casos EP y controles de arquitectura</title>
<desc id="description">Tres variantes independientes del cliente nuevo presencial: normal, faltante y descuento sin autorización. Respuestas leídas de las evidencias de Benjamín; no son operaciones reales en Odoo.</desc>
<rect width="1900" height="1160" fill="#ffffff"/>
<text x="30" y="60" font-family="Arial" font-size="43" fill="#16374c" font-weight="700">Un mismo caso comercial y tres respuestas controladas</text>
<rect x="30" y="100" width="420" height="205" rx="16" fill="#edf5fa" stroke="#286d9b" stroke-width="3"/>
<g transform="translate(50 120) scale(0.8125)" fill="none" stroke="#286d9b" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="71" height="58"/><circle cx="22" cy="29" r="9"/><path d="m10 54 5-11h14l7 11 M44 24h21 M44 36h21 M44 48h17"/></g>
<text x="140" y="159" font-family="Arial" font-size="31" fill="#286d9b" font-weight="700">Cliente nuevo</text>
<text x="50" y="252" font-family="Arial" font-size="30" fill="#183345">CLI-DEMO-001</text>
<polyline points="450,200 500,200" fill="none" stroke="#286d9b" stroke-width="4" stroke-linejoin="round"/>
<polygon points="500.0,200.0 484.2,208.6 484.2,191.4" fill="#286d9b"/>
<rect x="500" y="100" width="420" height="205" rx="16" fill="#edf5fa" stroke="#286d9b" stroke-width="3"/>
<g transform="translate(520 120) scale(0.8125)" fill="none" stroke="#286d9b" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="40.5" cy="11.5" r="11"/><circle cx="11.5" cy="53.5" r="11"/><circle cx="68.5" cy="53.5" r="11"/><path d="M40 24v9H12v9 M40 33h28v9"/></g>
<text x="610" y="159" font-family="Arial" font-size="31" fill="#286d9b" font-weight="700">Oportunidad</text>
<text x="520" y="252" font-family="Arial" font-size="30" fill="#183345">OPP-DEMO-001</text>
<polyline points="920,200 970,200" fill="none" stroke="#286d9b" stroke-width="4" stroke-linejoin="round"/>
<polygon points="970.0,200.0 954.2,208.6 954.2,191.4" fill="#286d9b"/>
<rect x="970" y="100" width="420" height="205" rx="16" fill="#edf5fa" stroke="#286d9b" stroke-width="3"/>
<g transform="translate(990 120) scale(0.8125)" fill="none" stroke="#286d9b" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h41l18 18v51H10z M51 3v18h18 M23 33h33 M23 46h33 M23 59h33"/></g>
<text x="1080" y="159" font-family="Arial" font-size="31" fill="#286d9b" font-weight="700">Cotización</text>
<text x="990" y="252" font-family="Arial" font-size="30" fill="#183345">COT-DEMO-001</text>
<polyline points="1390,200 1440,200" fill="none" stroke="#286d9b" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1440.0,200.0 1424.2,208.6 1424.2,191.4" fill="#286d9b"/>
<rect x="1440" y="100" width="420" height="205" rx="16" fill="#edf5fa" stroke="#286d9b" stroke-width="3"/>
<g transform="translate(1460 120) scale(0.8125)" fill="none" stroke="#286d9b" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="39.5" cy="37.5" r="36"/><path d="m21 38 13 13 25-26"/></g>
<text x="1550" y="159" font-family="Arial" font-size="31" fill="#286d9b" font-weight="700">Evaluación</text>
<text x="1460" y="252" font-family="Arial" font-size="30" fill="#183345">SOL y COR</text>
<text x="30" y="365" font-family="Arial" font-size="29" fill="#526574">5 autoradios × S/ 400 = S/ 2,000 · Persona natural · Tienda física · Visita espontánea</text>
<g id="EP-N01">
<rect x="30" y="410" width="1840" height="180" rx="16" fill="#eef8f3" stroke="#267b65" stroke-width="3"/>
<g transform="translate(55 450) scale(0.8125)" fill="none" stroke="#267b65" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="39.5" cy="37.5" r="36"/><path d="m21 38 13 13 25-26"/></g>
<text x="150" y="459" font-family="Arial" font-size="34" fill="#267b65" font-weight="700">EP-N01  Caso normal</text>
<text x="150" y="510" font-family="Arial" font-size="28" fill="#183345">5 % de descuento propuesto → S/ 1,900</text>
<text x="150" y="550" font-family="Arial" font-size="28" fill="#183345">Disponibilidad de evaluación: 8; cotización v1</text>
<text x="1010" y="466" font-family="Arial" font-size="31" fill="#267b65" font-weight="700">ACEPTADA</text>
<text x="1010" y="512" font-family="Arial" font-size="27" fill="#267b65">VALIDADA</text>
<text x="1010" y="555" font-family="Arial" font-size="27" fill="#183345">Solicitud validada; sin pedido ni reserva.</text>
</g>
<g id="EP-S01">
<rect x="30" y="615" width="1840" height="180" rx="16" fill="#fff7e9" stroke="#a76513" stroke-width="3"/>
<g transform="translate(55 655) scale(0.8125)" fill="none" stroke="#a76513" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 35h32v31H4z M42 35h32v31H42z M23 0h32v31H23z M20 35v12 M58 35v12 M39 0v12"/></g>
<text x="150" y="664" font-family="Arial" font-size="34" fill="#a76513" font-weight="700">EP-S01  Faltante</text>
<text x="150" y="715" font-family="Arial" font-size="28" fill="#183345">5 % de descuento propuesto → S/ 1,900</text>
<text x="150" y="755" font-family="Arial" font-size="28" fill="#183345">Disponibilidad 3 → faltan 2</text>
<text x="1010" y="671" font-family="Arial" font-size="31" fill="#a76513" font-weight="700">PROMESA_CONDICIONADA</text>
<text x="1010" y="717" font-family="Arial" font-size="27" fill="#a76513">DISPONIBILIDAD_PARCIAL</text>
<text x="1010" y="760" font-family="Arial" font-size="27" fill="#183345">REP-EP-001: evaluación conceptual P2P.</text>
</g>
<g id="EP-E01">
<rect x="30" y="820" width="1840" height="180" rx="16" fill="#fcf0f0" stroke="#b34043" stroke-width="3"/>
<g transform="translate(55 860) scale(0.8125)" fill="none" stroke="#b34043" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h50v67H14z m10 47 9 9 22-21"/><circle cx="39.5" cy="25.5" r="9.5"/></g>
<text x="150" y="869" font-family="Arial" font-size="34" fill="#b34043" font-weight="700">EP-E01  Excepción</text>
<text x="150" y="920" font-family="Arial" font-size="28" fill="#183345">10 % de descuento propuesto → S/ 1,800</text>
<text x="150" y="960" font-family="Arial" font-size="28" fill="#183345">Sin aprobación válida del dueño; cotización v2</text>
<text x="1010" y="876" font-family="Arial" font-size="31" fill="#b34043" font-weight="700">RECHAZADA</text>
<text x="1010" y="922" font-family="Arial" font-size="27" fill="#b34043">DESCUENTO_SIN_APROBACION</text>
<text x="1010" y="965" font-family="Arial" font-size="27" fill="#183345">Se rechaza la transición; el vendedor escala.</text>
</g>
<text x="30" y="1072" font-family="Arial" font-size="29" fill="#526574">Casos independientes de Benjamín · Datos sintéticos · order_id = null en los tres casos</text>
<text x="30" y="1114" font-family="Arial" font-size="28" fill="#526574">La respuesta rechazada conserva total = null; S/ 1,800 corresponde a la oferta propuesta.</text>
</svg>
