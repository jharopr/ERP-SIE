  <rect x="990" y="475" width="355" height="160" rx="17" fill="#fff" stroke="#275c81" stroke-width="3"/>
  <text x="1167" y="529" text-anchor="middle" class="node-title">ERP modular SaaS</text>
  <text x="1167" y="564" text-anchor="middle" class="node-sub">Ventas · inventario</text>
  <text x="1167" y="594" text-anchor="middle" class="node-sub">Facturación · reportes básicos</text>

  <rect x="990" y="690" width="355" height="105" rx="17" fill="#fff" stroke="#275c81" stroke-width="3"/>
  <text x="1167" y="735" text-anchor="middle" class="node-title">Persistencia</text>
  <text x="1167" y="765" text-anchor="middle" class="node-sub">transaccional del ERP</text>
  <rect x="620" y="810" width="725" height="42" rx="12" fill="#e8eef5" stroke="#9bb1c5" stroke-width="2"/>
  <text x="982" y="838" text-anchor="middle" font-size="17" font-weight="700">Proveedor SaaS o partner · actualización, respaldo y monitoreo según SLA pendiente</text>

  <rect x="1495" y="330" width="315" height="130" rx="17" fill="#fff" stroke="#71808b" stroke-width="3"/>
  <text x="1652" y="384" text-anchor="middle" class="node-title">WhatsApp</text>
  <text x="1652" y="418" text-anchor="middle" class="node-sub">Canal externo</text>
  <rect x="1495" y="620" width="315" height="130" rx="17" fill="#fff" stroke="#71808b" stroke-width="3"/>
  <text x="1652" y="673" text-anchor="middle" class="node-title">OSE, PSE o SUNAT</text>
  <text x="1652" y="708" text-anchor="middle" class="node-sub">Ruta por confirmar</text>

  <path d="M 440 681 H 620" class="edge"/>
  <text x="530" y="646" text-anchor="middle" class="small">Internet · HTTPS</text>
  <path d="M 940 681 H 965 V 575 H 990" class="edge"/>
  <path d="M 1167 635 V 690" class="edge"/>
  <path d="M 940 465 H 965 V 515 H 990" class="pending"/>
  <path d="M 940 370 H 1495" class="pending"/><path d="M 1495 430 H 940" class="pending"/>
  <text x="1402" y="315" text-anchor="middle" class="small">API, webhook o conector · pendiente</text>
  <path d="M 1345 550 H 1415 V 650 H 1495" class="pending"/>
  <path d="M 1495 715 H 1405 V 610 H 1345" class="pending"/>
  <text x="1652" y="792" text-anchor="middle" class="small">Comprobante / estado · pendiente</text>

  <line x1="335" y1="972" x2="430" y2="972" stroke="#325872" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="453" y="979" class="legend">Relación incluida en la propuesta</text>
  <line x1="890" y1="972" x2="985" y2="972" stroke="#be741c" stroke-width="4" stroke-dasharray="13 9" marker-end="url(#arrow-orange)"/>
  <text x="1008" y="979" class="legend">Integración pendiente de demostración</text>
  <text x="960" y="1031" text-anchor="middle" class="small">ND = no documentado · Despliegue conceptual; no se han confirmado proveedor, SLA ni conectividad.</text>
</svg>
