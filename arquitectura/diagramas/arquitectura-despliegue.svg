<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Arquitectura ERP base de despliegue</title>
  <desc id="descripcion">Tres límites: usuarios de Importaciones MYS con navegador, plataforma SaaS con aplicación web, ERP, integración y persistencia, y servicios externos WhatsApp y OSE, PSE o SUNAT. Las integraciones externas están pendientes de demostración.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#325872"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#be741c"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#233345}.title{font-size:42px;font-weight:700;fill:#850605}.subtitle{font-size:21px;fill:#687787}.header-white{fill:#fff}.node-title{font-size:23px;font-weight:700}.node-sub{font-size:17px;fill:#667889}.small{font-size:16px;fill:#536879}.legend{font-size:18px;fill:#465666}.edge{fill:none;stroke:#325872;stroke-width:4;marker-end:url(#arrow)}.pending{fill:none;stroke:#be741c;stroke-width:4;stroke-dasharray:13 9;marker-end:url(#arrow-orange)}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>
  <text x="960" y="82" text-anchor="middle" class="title">Arquitectura ERP base de despliegue</text>
  <text x="960" y="120" text-anchor="middle" class="subtitle">Acceso web a plataforma SaaS · límites y conexiones propuestas</text>

  <rect x="55" y="185" width="470" height="690" rx="23" fill="#f2f9f4" stroke="#287b5a" stroke-width="4"/>
  <rect x="55" y="185" width="470" height="70" rx="23" fill="#287b5a"/><rect x="55" y="230" width="470" height="25" fill="#287b5a"/>
  <text x="290" y="230" text-anchor="middle" font-size="24" font-weight="700" class="header-white">Usuarios de Importaciones MYS</text>

  <rect x="575" y="185" width="815" height="690" rx="23" fill="#f4f8fc" stroke="#173b5c" stroke-width="4"/>
  <rect x="575" y="185" width="815" height="70" rx="23" fill="#173b5c"/><rect x="575" y="230" width="815" height="25" fill="#173b5c"/>
  <text x="982" y="230" text-anchor="middle" font-size="25" font-weight="700" class="header-white">Plataforma SaaS o nube administrada</text>

  <rect x="1440" y="185" width="425" height="690" rx="23" fill="#f5f6f7" stroke="#71808b" stroke-width="4"/>
  <rect x="1440" y="185" width="425" height="70" rx="23" fill="#687783"/><rect x="1440" y="230" width="425" height="25" fill="#687783"/>
  <text x="1652" y="230" text-anchor="middle" font-size="25" font-weight="700" class="header-white">Servicios externos</text>

  <rect x="85" y="315" width="195" height="100" rx="14" fill="#fff" stroke="#287b5a" stroke-width="2"/>
  <text x="182" y="356" text-anchor="middle" class="node-title">Ventas y</text><text x="182" y="384" text-anchor="middle" class="node-title">atención</text>
  <rect x="300" y="315" width="195" height="100" rx="14" fill="#fff" stroke="#287b5a" stroke-width="2"/>
  <text x="397" y="372" text-anchor="middle" class="node-title">Almacén</text>
  <rect x="85" y="440" width="195" height="100" rx="14" fill="#fff" stroke="#287b5a" stroke-width="2"/>
  <text x="182" y="498" text-anchor="middle" class="node-title">Facturación</text>
  <rect x="300" y="440" width="195" height="100" rx="14" fill="#fff" stroke="#287b5a" stroke-width="2"/>
  <text x="397" y="499" text-anchor="middle" class="node-title">Gerencia</text>
