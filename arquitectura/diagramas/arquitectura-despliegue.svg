  <path d="M 290 592 V 635" class="edge"/>
  <rect x="140" y="635" width="300" height="115" rx="17" fill="#eaf6ee" stroke="#287b5a" stroke-width="3"/>
  <text x="290" y="682" text-anchor="middle" class="node-title">Navegador web</text>
  <text x="290" y="716" text-anchor="middle" class="node-sub">Dispositivo del usuario</text>

  <rect x="620" y="330" width="320" height="155" rx="17" fill="#fff3e3" stroke="#be741c" stroke-width="3"/>
