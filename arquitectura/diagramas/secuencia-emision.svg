<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Secuencia de venta y emisión electrónica</title>
  <desc id="desc">Diagrama UML de secuencia que muestra el flujo normal y los caminos de aceptación, rechazo y falta de respuesta.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
    <style>
      .title{font:700 34px Arial;fill:#10243e}.sub{font:18px Arial;fill:#42526b}.actor{fill:#e8f1ff;stroke:#2563eb;stroke-width:2}.system{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.external{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.h{font:700 18px Arial;fill:#10243e}.t{font:15px Arial;fill:#23324a}.small{font:13px Arial;fill:#475569}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}.call{stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.return{stroke:#ea580c;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrowOrange)}.alt{fill:#fffbeb;stroke:#ca8a04;stroke-width:2}
    </style>
  </defs>
  <rect width="1800" height="1080" fill="#fff"/>
  <text x="45" y="55" class="title">Venta y emisión electrónica</text>
  <text x="45" y="88" class="sub">UML · secuencia normal, rechazo controlado y reintento idempotente</text>

  <g>
    <rect x="60" y="125" width="190" height="70" rx="10" class="actor"/><text x="155" y="168" text-anchor="middle" class="h">Cliente</text>
    <rect x="350" y="125" width="190" height="70" rx="10" class="actor"/><text x="445" y="168" text-anchor="middle" class="h">Ventas</text>
    <rect x="640" y="125" width="190" height="70" rx="10" class="system"/><text x="735" y="168" text-anchor="middle" class="h">Odoo</text>
    <rect x="930" y="125" width="190" height="70" rx="10" class="system"/><text x="1025" y="168" text-anchor="middle" class="h">Adaptador</text>
    <rect x="1220" y="125" width="190" height="70" rx="10" class="external"/><text x="1315" y="168" text-anchor="middle" class="h">UBLHUB</text>
    <rect x="1510" y="125" width="190" height="70" rx="10" class="external"/><text x="1605" y="168" text-anchor="middle" class="h">SUNAT</text>
    <line x1="155" y1="195" x2="155" y2="1020" class="life"/><line x1="445" y1="195" x2="445" y2="1020" class="life"/><line x1="735" y1="195" x2="735" y2="1020" class="life"/><line x1="1025" y1="195" x2="1025" y2="1020" class="life"/><line x1="1315" y1="195" x2="1315" y2="1020" class="life"/><line x1="1605" y1="195" x2="1605" y2="1020" class="life"/>
  </g>

  <g>
    <line x1="155" y1="245" x2="445" y2="245" class="call"/><text x="300" y="235" text-anchor="middle" class="t">1. Solicita producto y documento</text>
    <line x1="445" y1="305" x2="735" y2="305" class="call"/><text x="590" y="295" text-anchor="middle" class="t">2. Busca cliente y registra canal</text>
    <line x1="735" y1="365" x2="445" y2="365" class="return"/><text x="590" y="355" text-anchor="middle" class="t">3. Devuelve ficha, precio y stock</text>
    <line x1="445" y1="425" x2="155" y2="425" class="return"/><text x="300" y="415" text-anchor="middle" class="t">4. Presenta cotización</text>
    <line x1="155" y1="485" x2="445" y2="485" class="call"/><text x="300" y="475" text-anchor="middle" class="t">5. Confirma compra y datos</text>
    <line x1="445" y1="545" x2="735" y2="545" class="call"/><text x="590" y="535" text-anchor="middle" class="t">6. Confirma pedido y pago</text>
    <line x1="735" y1="605" x2="1025" y2="605" class="call"/><text x="880" y="595" text-anchor="middle" class="t">7. Solicita emisión con clave idempotente</text>
    <line x1="1025" y1="665" x2="1315" y2="665" class="call"/><text x="1170" y="655" text-anchor="middle" class="t">8. Envía mensaje autenticado</text>
    <line x1="1315" y1="725" x2="1605" y2="725" class="call"/><text x="1460" y="715" text-anchor="middle" class="t">9. Canaliza documento</text>
    <line x1="1605" y1="785" x2="1315" y2="785" class="return"/><text x="1460" y="775" text-anchor="middle" class="t">10. Respuesta tributaria</text>
  </g>

  <rect x="610" y="820" width="1030" height="165" rx="10" class="alt"/>
  <text x="630" y="848" class="h">ALT</text>
  <line x1="1315" y1="870" x2="1025" y2="870" class="return"/><text x="1170" y="860" text-anchor="middle" class="t">Aceptado: ID, estado y archivos</text>
  <line x1="1025" y1="925" x2="735" y2="925" class="return"/><text x="880" y="915" text-anchor="middle" class="t">Actualiza venta y habilita entrega</text>
  <line x1="735" y1="970" x2="445" y2="970" class="return"/><text x="590" y="960" text-anchor="middle" class="t">Comprobante disponible</text>
  <text x="1090" y="955" class="small">Rechazado: conserva mensaje, asigna corrección y reintenta con la misma clave.</text>
  <text x="1090" y="978" class="small">Sin respuesta: encola, alerta y consulta estado antes de reenviar.</text>
  <line x1="445" y1="1020" x2="155" y2="1020" class="return"/><text x="300" y="1010" text-anchor="middle" class="t">11. Entrega producto y comprobante</text>
</svg>
