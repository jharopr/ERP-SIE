<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Actores y casos de uso de Odoo con UBLHUB</title>
  <desc id="desc">Diagrama UML que relaciona actores de negocio, casos de uso de Odoo y sistemas externos.</desc>
  <defs>
    <style>
      .title{font:700 34px Arial;fill:#10243e}.sub{font:18px Arial;fill:#42526b}.actor{fill:#e8f1ff;stroke:#2563eb;stroke-width:2}.system{fill:#fff1e8;stroke:#ea580c;stroke-width:2}.boundary{fill:#f8fafc;stroke:#64748b;stroke-width:2}.use{fill:#fff;stroke:#334155;stroke-width:2}.h{font:700 20px Arial;fill:#10243e}.t{font:16px Arial;fill:#23324a}.small{font:14px Arial;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{fill:none;stroke:#ea580c;stroke-width:2;stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="50" y="55" class="title">Actores y casos de uso</text>
  <text x="50" y="88" class="sub">UML · Odoo es el límite funcional; WhatsApp y la atención presencial son canales</text>

  <rect x="350" y="120" width="900" height="800" rx="20" class="boundary"/>
  <text x="380" y="158" class="h">Sistema Odoo</text>

  <g class="line">
    <path d="M290 200 L470 230"/><path d="M290 200 L470 335"/>
    <path d="M290 335 L470 230"/><path d="M290 335 L470 335"/><path d="M290 335 L470 440"/><path d="M290 335 L470 545"/><path d="M290 335 L870 335"/>
    <path d="M290 470 L470 440"/><path d="M290 470 L470 650"/>
    <path d="M290 605 L470 545"/><path d="M290 605 L470 755"/>
    <path d="M290 740 L470 860"/><path d="M290 740 L890 755"/>
    <path d="M290 875 L890 860"/><path d="M290 875 L890 545"/>
    <path d="M1130 545 L1350 335"/><path d="M1130 650 L1350 470"/><path d="M1450 535 L1450 605"/>
  </g>
  <path d="M1130 545 L1350 335" class="dash"/>

  <g>
    <rect x="40" y="155" width="250" height="90" rx="12" class="actor"/><text x="165" y="190" text-anchor="middle" class="h">Cliente</text><text x="165" y="218" text-anchor="middle" class="small">Solicita y confirma</text>
    <rect x="40" y="290" width="250" height="90" rx="12" class="actor"/><text x="165" y="325" text-anchor="middle" class="h">Ventas y atención</text><text x="165" y="353" text-anchor="middle" class="small">Registra ambos canales</text>
    <rect x="40" y="425" width="250" height="90" rx="12" class="actor"/><text x="165" y="460" text-anchor="middle" class="h">Almacén</text><text x="165" y="488" text-anchor="middle" class="small">Reserva y entrega</text>
    <rect x="40" y="560" width="250" height="90" rx="12" class="actor"/><text x="165" y="595" text-anchor="middle" class="h">Facturación</text><text x="165" y="623" text-anchor="middle" class="small">Emite y concilia</text>
    <rect x="40" y="695" width="250" height="90" rx="12" class="actor"/><text x="165" y="730" text-anchor="middle" class="h">Gerencia</text><text x="165" y="758" text-anchor="middle" class="small">Controla y autoriza</text>
    <rect x="40" y="830" width="250" height="90" rx="12" class="actor"/><text x="165" y="865" text-anchor="middle" class="h">Administrador</text><text x="165" y="893" text-anchor="middle" class="small">Configura y monitorea</text>
  </g>

  <g>
    <ellipse cx="600" cy="230" rx="130" ry="48" class="use"/><text x="600" y="225" text-anchor="middle" class="t">Gestionar ficha</text><text x="600" y="247" text-anchor="middle" class="t">única de cliente</text>
    <ellipse cx="600" cy="335" rx="130" ry="48" class="use"/><text x="600" y="330" text-anchor="middle" class="t">Cotizar y registrar</text><text x="600" y="352" text-anchor="middle" class="t">pedido</text>
    <ellipse cx="600" cy="440" rx="130" ry="48" class="use"/><text x="600" y="435" text-anchor="middle" class="t">Consultar, reservar</text><text x="600" y="457" text-anchor="middle" class="t">y mover stock</text>
    <ellipse cx="600" cy="545" rx="130" ry="48" class="use"/><text x="600" y="540" text-anchor="middle" class="t">Confirmar venta</text><text x="600" y="562" text-anchor="middle" class="t">y pago</text>
    <ellipse cx="600" cy="650" rx="130" ry="48" class="use"/><text x="600" y="645" text-anchor="middle" class="t">Preparar y</text><text x="600" y="667" text-anchor="middle" class="t">entregar pedido</text>
    <ellipse cx="600" cy="755" rx="130" ry="48" class="use"/><text x="600" y="750" text-anchor="middle" class="t">Conciliar venta,</text><text x="600" y="772" text-anchor="middle" class="t">stock y documento</text>
    <ellipse cx="600" cy="860" rx="130" ry="48" class="use"/><text x="600" y="855" text-anchor="middle" class="t">Administrar usuarios</text><text x="600" y="877" text-anchor="middle" class="t">y permisos</text>

    <ellipse cx="1000" cy="335" rx="130" ry="48" class="use"/><text x="1000" y="330" text-anchor="middle" class="t">Registrar canal</text><text x="1000" y="352" text-anchor="middle" class="t">de origen</text>
    <ellipse cx="1000" cy="545" rx="130" ry="48" class="use"/><text x="1000" y="540" text-anchor="middle" class="t">Emitir documento</text><text x="1000" y="562" text-anchor="middle" class="t">electrónico</text>
    <ellipse cx="1000" cy="650" rx="130" ry="48" class="use"/><text x="1000" y="645" text-anchor="middle" class="t">Consultar estado</text><text x="1000" y="667" text-anchor="middle" class="t">y resolver error</text>
    <ellipse cx="1000" cy="755" rx="130" ry="48" class="use"/><text x="1000" y="750" text-anchor="middle" class="t">Consultar reportes</text><text x="1000" y="772" text-anchor="middle" class="t">y autorizar excepción</text>
    <ellipse cx="1000" cy="860" rx="130" ry="48" class="use"/><text x="1000" y="855" text-anchor="middle" class="t">Monitorear integración</text><text x="1000" y="877" text-anchor="middle" class="t">y respaldos</text>
  </g>

  <g>
    <rect x="1350" y="290" width="200" height="90" rx="12" class="system"/><text x="1450" y="325" text-anchor="middle" class="h">Adaptador</text><text x="1450" y="353" text-anchor="middle" class="small">Idempotencia y auditoría</text>
    <rect x="1350" y="425" width="200" height="90" rx="12" class="system"/><text x="1450" y="460" text-anchor="middle" class="h">UBLHUB</text><text x="1450" y="488" text-anchor="middle" class="small">Procesa documentos</text>
    <rect x="1350" y="605" width="200" height="90" rx="12" class="system"/><text x="1450" y="640" text-anchor="middle" class="h">SUNAT</text><text x="1450" y="668" text-anchor="middle" class="small">Sistema regulador</text>
  </g>

  <rect x="1240" y="820" width="310" height="100" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <rect x="1260" y="842" width="25" height="18" class="actor"/><text x="1295" y="857" class="small">Actor de negocio</text>
  <rect x="1260" y="878" width="25" height="18" class="system"/><text x="1295" y="893" class="small">Sistema interno o externo</text>
</svg>
