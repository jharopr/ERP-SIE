  <line x1="855" y1="984" x2="950" y2="984" stroke="#be741c" stroke-width="4" stroke-dasharray="13 9" marker-end="url(#arrow-orange)"/>
  <text x="975" y="991" class="legend">Integración pendiente de demostración</text>
  <text x="960" y="1032" text-anchor="middle" class="small">ND = no documentado · Los roles son lógicos; el diagrama no representa sistemas existentes confirmados.</text>
