<text x="42" y="1070.0" font-family="Arial, sans-serif" font-size="19" fill="#637382" text-anchor="start">Fuentes de la brecha: S1 y S2. Diseño: Benjamín, PC3. Línea continua: secuencia; discontinua: mensaje; rombo X: decisión exclusiva; +: subproceso no automático. BPMN</text>
