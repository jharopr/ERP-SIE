<text x="46" y="487" font-size="16" fill="#15324A" font-weight="400" text-anchor="start">cliente nuevo</text>
<text x="46" y="512" font-size="16" fill="#15324A" font-weight="400" text-anchor="start">público general</text>
<text x="46" y="537" font-size="16" fill="#15324A" font-weight="400" text-anchor="start">Canal físico</text>
<polyline points="185,469 210,469" fill="none" stroke="#4A637A" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1398" y="401" width="175" height="156" rx="12" fill="#EAF7EF" stroke="#176447" stroke-width="1.5"/>
<text x="1416" y="433" font-size="19" fill="#176447" font-weight="700" text-anchor="start">Valor esperado</text>
<text x="1416" y="462" font-size="17" fill="#15324A" font-weight="400" text-anchor="start">Cotización clara</text>
<text x="1416" y="487" font-size="17" fill="#15324A" font-weight="400" text-anchor="start">y respuesta</text>
<text x="1416" y="512" font-size="17" fill="#15324A" font-weight="400" text-anchor="start">trazable para</text>
<text x="1416" y="537" font-size="17" fill="#15324A" font-weight="400" text-anchor="start">decidir la compra</text>
<polyline points="1370,469 1398,469" fill="none" stroke="#4A637A" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="52" y="635" font-size="20" fill="#15324A" font-weight="700" text-anchor="start">PROCESOS DE SOPORTE</text>
<rect x="55" y="658" width="350" height="120" rx="12" fill="#F1F4F7" stroke="#4A637A" stroke-width="1.5"/>
<text x="73" y="690" font-size="20" fill="#4A637A" font-weight="700" text-anchor="start">Administración y finanzas</text>
<text x="73" y="719" font-size="18" fill="#15324A" font-weight="400" text-anchor="start">Caja, registros y control</text>
<text x="73" y="744" font-size="18" fill="#15324A" font-weight="400" text-anchor="start">de obligaciones</text>
<rect x="435" y="658" width="350" height="120" rx="12" fill="#F1F4F7" stroke="#4A637A" stroke-width="1.5"/>
<text x="453" y="690" font-size="20" fill="#4A637A" font-weight="700" text-anchor="start">Sistemas y datos</text>
<text x="453" y="719" font-size="18" fill="#15324A" font-weight="400" text-anchor="start">Catálogo, clientes, versiones</text>
<text x="453" y="744" font-size="18" fill="#15324A" font-weight="400" text-anchor="start">y trazabilidad documental</text>
<rect x="815" y="658" width="350" height="120" rx="12" fill="#F1F4F7" stroke="#4A637A" stroke-width="1.5"/>
<text x="833" y="690" font-size="20" fill="#4A637A" font-weight="700" text-anchor="start">Gestión de personas</text>
<text x="833" y="719" font-size="18" fill="#15324A" font-weight="400" text-anchor="start">Roles, responsabilidades</text>
<text x="833" y="744" font-size="18" fill="#15324A" font-weight="400" text-anchor="start">y capacidades comerciales</text>
<rect x="1195" y="658" width="350" height="120" rx="12" fill="#F1F4F7" stroke="#4A637A" stroke-width="1.5"/>
<text x="1213" y="690" font-size="20" fill="#4A637A" font-weight="700" text-anchor="start">Cumplimiento y archivo</text>
<text x="1213" y="719" font-size="18" fill="#15324A" font-weight="400" text-anchor="start">Documentos, autorizaciones</text>
<text x="1213" y="744" font-size="18" fill="#15324A" font-weight="400" text-anchor="start">y evidencias del proceso</text>
<rect x="55" y="817" width="1490" height="82" rx="12" fill="#FFF4DC" stroke="#87540A" stroke-width="1.5"/>
<text x="77" y="848" font-size="19" fill="#87540A" font-weight="400" text-anchor="start">Alcance seleccionado: O2C presencial de cliente persona natural NUEVA, desde consulta hasta respuesta a solicitud ERP.</text>
<text x="77" y="875" font-size="19" fill="#87540A" font-weight="400" text-anchor="start">Empresa comercializadora: el mapa no incorpora manufactura. Los procesos de soporte y P2P se incluyen como contexto.</text>
<text x="42" y="961" font-size="17" fill="#526578" font-weight="400" text-anchor="start">Diseño / simulación local · Odoo no desplegado · cantidades, precios y stock sintéticos</text>
<text x="42" y="986" font-size="16" fill="#526578" font-weight="400" text-anchor="start">IMPORTACIONES MYS HERMANOS S.A.C. · Público general · Canal físico walk-in · Continuidad PC2 v2.1</text>
