<text x="253" y="430" font-size="21" fill="#006C87" font-weight="700" text-anchor="start">O2C · venta al cliente</text>
<text x="253" y="459" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">Consulta → cotización →</text>
<text x="253" y="484" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">solicitud y respuesta ERP</text>
<text x="253" y="509" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">Resto O2C: contexto fuera EP</text>
<rect x="625" y="398" width="340" height="138" rx="12" fill="#FFFFFF" stroke="#006C87" stroke-width="1.5"/>
<text x="643" y="430" font-size="21" fill="#006C87" font-weight="700" text-anchor="start">Inventario comercial</text>
<text x="643" y="459" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">Consulta de disponibilidad</text>
<text x="643" y="484" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">y control de existencias</text>
<text x="643" y="509" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">Sin reserva en la demo EP</text>
<rect x="1015" y="398" width="330" height="138" rx="12" fill="#FFFFFF" stroke="#006C87" stroke-width="1.5"/>
<text x="1033" y="430" font-size="21" fill="#006C87" font-weight="700" text-anchor="start">P2P · abastecimiento</text>
<text x="1033" y="459" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">Necesidad → compra →</text>
<text x="1033" y="484" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">recepción y pago proveedor</text>
<text x="1033" y="509" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">En EP: señal y evaluación</text>
<polyline points="575,468 625,468" fill="none" stroke="#4A637A" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="965,468 1015,468" fill="none" stroke="#87540A" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#amberarrow)"/>
<text x="805" y="564" font-size="17" fill="#526578" font-weight="400" text-anchor="middle">Interacciones entre procesos; no representa una secuencia de producción</text>
<rect x="28" y="401" width="157" height="156" rx="12" fill="#EAF7EF" stroke="#176447" stroke-width="1.5"/>
<text x="46" y="433" font-size="20" fill="#176447" font-weight="700" text-anchor="start">Entrada</text>
