<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Mapa corporativo de procesos — IMPORTACIONES MYS HERMANOS S.A.C.</title>
<desc id="desc">Caso didáctico de IMPORTACIONES MYS HERMANOS S.A.C. Cliente nuevo persona natural, público general y canal físico. Diseño y simulación local; Odoo no desplegado. Datos sintéticos.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#4A637A"/></marker><marker id="amberarrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#87540A"/></marker><marker id="grayarrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#ABB6C2"/></marker></defs>
<style>text {font-family: "Segoe UI", Arial, sans-serif;} .title {font-weight:700;} </style>
<rect width="1600" height="1000" fill="#FBFCFE"/>
<rect x="36" y="30" width="47" height="47" rx="10" fill="#15324A" stroke="#15324A" stroke-width="1.5"/>
<text x="59" y="62" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">01</text>
<text x="102" y="61" font-size="30" fill="#15324A" font-weight="700" text-anchor="start">Mapa corporativo · nivel 1</text>
<text x="41" y="106" font-size="19" fill="#526578" font-weight="400" text-anchor="start">Comercialización de autoradios: procesos estratégicos, misionales y de soporte. Propuesta analítica del caso.</text>
<text x="52" y="157" font-size="20" fill="#15324A" font-weight="700" text-anchor="start">PROCESOS ESTRATÉGICOS</text>
<rect x="55" y="180" width="350" height="120" rx="12" fill="#F1F4F7" stroke="#4A637A" stroke-width="1.5"/>
<text x="73" y="212" font-size="21" fill="#4A637A" font-weight="700" text-anchor="start">Dirección del negocio</text>
<text x="73" y="241" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">Objetivos comerciales</text>
<text x="73" y="266" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">y seguimiento del desempeño</text>
<rect x="435" y="180" width="350" height="120" rx="12" fill="#F1F4F7" stroke="#4A637A" stroke-width="1.5"/>
<text x="453" y="212" font-size="21" fill="#4A637A" font-weight="700" text-anchor="start">Gestión comercial</text>
<text x="453" y="241" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">Precios, descuentos</text>
<text x="453" y="266" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">y propuesta de valor</text>
<rect x="815" y="180" width="350" height="120" rx="12" fill="#F1F4F7" stroke="#4A637A" stroke-width="1.5"/>
<text x="833" y="212" font-size="21" fill="#4A637A" font-weight="700" text-anchor="start">Planificación de compras</text>
<text x="833" y="241" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">Proveedores, reposición</text>
<text x="833" y="266" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">y disponibilidad objetivo</text>
<rect x="1195" y="180" width="350" height="120" rx="12" fill="#F1F4F7" stroke="#4A637A" stroke-width="1.5"/>
<text x="1213" y="212" font-size="21" fill="#4A637A" font-weight="700" text-anchor="start">Control y mejora</text>
<text x="1213" y="241" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">Indicadores, riesgos</text>
<text x="1213" y="266" font-size="19" fill="#15324A" font-weight="400" text-anchor="start">y experiencia del cliente</text>
<rect x="210" y="335" width="1160" height="245" rx="12" fill="#E8F6FA" stroke="#006C87" stroke-width="2"/>
<text x="232" y="370" font-size="21" fill="#006C87" font-weight="700" text-anchor="start">PROCESOS MISIONALES / CORE</text>
