<text x="225" y="358" font-size="20" font-weight="400" style="fill:#173148">Registrar consulta</text>
<text x="225" y="384" font-size="20" font-weight="400" style="fill:#173148">física 09:45</text>
<rect x="469" y="325" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="482" y="358" font-size="20" font-weight="400" style="fill:#173148">Buscar cliente;</text>
<text x="482" y="384" font-size="20" font-weight="400" style="fill:#173148">calificar lead y</text>
<text x="482" y="410" font-size="20" font-weight="400" style="fill:#173148">oportunidad</text>
<rect x="726" y="325" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="739" y="358" font-size="20" font-weight="400" style="fill:#173148">Consultar Inventario sin</text>
<text x="739" y="384" font-size="20" font-weight="400" style="fill:#173148">reservar</text>
<rect x="983" y="325" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="996" y="358" font-size="20" font-weight="400" style="fill:#173148">Calcular precio y</text>
<text x="996" y="384" font-size="20" font-weight="400" style="fill:#173148">controlar facultad 5 %</text>
<rect x="1240" y="325" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="1253" y="358" font-size="20" font-weight="400" style="fill:#173148">Vincular aceptación;</text>
<text x="1253" y="384" font-size="20" font-weight="400" style="fill:#173148">enviar solicitud</text>
<rect x="1497" y="325" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="1510" y="358" font-size="20" font-weight="400" style="fill:#173148">Validar; comunicar</text>
<text x="1510" y="384" font-size="20" font-weight="400" style="fill:#173148">motivo y responsable</text>
<text x="47" y="505" font-size="19" font-weight="700" style="fill:#173148">Evidencia</text>
<rect x="212" y="470" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="225" y="503" font-size="20" font-weight="400" style="fill:#173148">Canal FISICO y visita</text>
<text x="225" y="529" font-size="20" font-weight="400" style="fill:#173148">espontánea</text>
<rect x="469" y="470" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="482" y="503" font-size="20" font-weight="400" style="fill:#173148">CLI-DEMO-001 / LEAD-</text>
<text x="482" y="529" font-size="20" font-weight="400" style="fill:#173148">EP-001 / OPP-DEMO-001</text>
<rect x="726" y="470" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="739" y="503" font-size="20" font-weight="400" style="fill:#173148">SKU RAD-7BT, ubicación y</text>
<text x="739" y="529" font-size="20" font-weight="400" style="fill:#173148">hora</text>
<rect x="983" y="470" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="996" y="503" font-size="20" font-weight="400" style="fill:#173148">COT-DEMO-001 v1; total y</text>
<text x="996" y="529" font-size="20" font-weight="400" style="fill:#173148">vencimiento</text>
<rect x="1240" y="470" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="1253" y="503" font-size="20" font-weight="400" style="fill:#173148">ACE-EP-001 / SOL-EP-N01</text>
<rect x="1497" y="470" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="1510" y="503" font-size="20" font-weight="400" style="fill:#173148">COR-EP-001; estado</text>
<text x="1510" y="529" font-size="20" font-weight="400" style="fill:#173148">ACEPTADA y código</text>
<text x="1510" y="555" font-size="20" font-weight="400" style="fill:#173148">VALIDADA</text>
<text x="47" y="650" font-size="19" font-weight="700" style="fill:#173148">Emoción deseada</text>
<rect x="212" y="615" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="225" y="648" font-size="20" font-weight="400" style="fill:#173148">Orientación</text>
<rect x="469" y="615" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="482" y="648" font-size="20" font-weight="400" style="fill:#173148">Confianza en la atención</text>
<rect x="726" y="615" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="739" y="648" font-size="20" font-weight="400" style="fill:#173148">Claridad sobre límites</text>
<rect x="983" y="615" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="996" y="648" font-size="20" font-weight="400" style="fill:#173148">Comprensión de la oferta</text>
<rect x="1240" y="615" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="1253" y="648" font-size="20" font-weight="400" style="fill:#173148">Seguridad sobre lo</text>
<text x="1253" y="674" font-size="20" font-weight="400" style="fill:#173148">aceptado</text>
<rect x="1497" y="615" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="1510" y="648" font-size="20" font-weight="400" style="fill:#173148">Claridad aun ante una</text>
<text x="1510" y="674" font-size="20" font-weight="400" style="fill:#173148">espera</text>
<text x="47" y="795" font-size="19" font-weight="700" style="fill:#173148">Control y mejora</text>
<rect x="212" y="760" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="225" y="793" font-size="20" font-weight="400" style="fill:#173148">Responsable identificado</text>
<rect x="469" y="760" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="482" y="793" font-size="20" font-weight="400" style="fill:#173148">Minimizar datos y evitar</text>
<text x="482" y="819" font-size="20" font-weight="400" style="fill:#173148">duplicidad</text>
<rect x="726" y="760" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="739" y="793" font-size="20" font-weight="400" style="fill:#173148">Observación no equivale</text>
<text x="739" y="819" font-size="20" font-weight="400" style="fill:#173148">a reserva</text>
<rect x="983" y="760" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="996" y="793" font-size="20" font-weight="400" style="fill:#173148">Nueva versión si cambian</text>
<text x="996" y="819" font-size="20" font-weight="400" style="fill:#173148">condiciones</text>
<rect x="1240" y="760" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="1253" y="793" font-size="20" font-weight="400" style="fill:#173148">Aceptación exacta de la</text>
<text x="1253" y="819" font-size="20" font-weight="400" style="fill:#173148">versión</text>
<rect x="1497" y="760" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="1510" y="793" font-size="20" font-weight="400" style="fill:#173148">Stock parcial: REP-</text>
<text x="1510" y="819" font-size="20" font-weight="400" style="fill:#173148">EP-001; sin fecha ni</text>
<text x="1510" y="845" font-size="20" font-weight="400" style="fill:#173148">compra</text>
<text x="42" y="953" font-size="18" font-weight="400" style="fill:#173148">Diseño por validar · emociones no medidas · sin pedido, reserva ni P2P ejecutado · datos sintéticos.</text>
<text x="42" y="985" font-size="17" font-weight="400" style="fill:#173148">IMPORTACIONES MYS HERMANOS S.A.C. · Benjamin Arancibia · GE703 G7 · Examen parcial 24/10/2026</text>
