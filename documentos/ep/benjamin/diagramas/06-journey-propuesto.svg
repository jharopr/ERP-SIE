<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1010" viewBox="0 0 1800 1010" role="img" aria-labelledby="title desc">
<title id="title">Journey propuesto del cliente en tienda</title>
<desc id="desc">Público general nuevo · visita espontánea · experiencia deseada hasta la respuesta a la solicitud ERP.</desc>
<rect width="1800" height="1010" fill="#ffffff"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#173148}</style>
<text x="42" y="57" font-size="34" font-weight="700" style="fill:#173148">Journey propuesto del cliente en tienda</text>
<text x="42" y="95" font-size="19" font-weight="400" style="fill:#173148">Público general nuevo · visita espontánea · experiencia deseada hasta la respuesta a la solicitud ERP.</text>
<rect x="212" y="125" width="253" height="47" rx="7" fill="#173148"/>
<text x="226" y="155" font-size="21" font-weight="700" style="fill:#ffffff">1  Llegada</text>
<rect x="469" y="125" width="253" height="47" rx="7" fill="#173148"/>
<text x="483" y="155" font-size="21" font-weight="700" style="fill:#ffffff">2  Necesidad</text>
<rect x="726" y="125" width="253" height="47" rx="7" fill="#173148"/>
<text x="740" y="155" font-size="21" font-weight="700" style="fill:#ffffff">3  Disponibilidad</text>
<rect x="983" y="125" width="253" height="47" rx="7" fill="#173148"/>
<text x="997" y="155" font-size="21" font-weight="700" style="fill:#ffffff">4  Oferta</text>
<rect x="1240" y="125" width="253" height="47" rx="7" fill="#173148"/>
<text x="1254" y="155" font-size="21" font-weight="700" style="fill:#ffffff">5  Aceptación</text>
<rect x="1497" y="125" width="253" height="47" rx="7" fill="#173148"/>
<text x="1511" y="155" font-size="21" font-weight="700" style="fill:#ffffff">6  Respuesta</text>
<text x="47" y="215" font-size="19" font-weight="700" style="fill:#173148">Cliente</text>
<rect x="212" y="180" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="225" y="213" font-size="20" font-weight="400" style="fill:#173148">Recibe orientación y</text>
<text x="225" y="239" font-size="20" font-weight="400" style="fill:#173148">responsable</text>
<rect x="469" y="180" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="482" y="213" font-size="20" font-weight="400" style="fill:#173148">Explica uso y cinco</text>
<text x="482" y="239" font-size="20" font-weight="400" style="fill:#173148">unidades</text>
<rect x="726" y="180" width="253" height="140" rx="4" fill="#e9f4f8"/>
<text x="739" y="213" font-size="20" font-weight="400" style="fill:#173148">Conoce disponibilidad</text>
<text x="739" y="239" font-size="20" font-weight="400" style="fill:#173148">consultada</text>
<rect x="983" y="180" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="996" y="213" font-size="20" font-weight="400" style="fill:#173148">Recibe v1 por S/ 1,900</text>
<text x="996" y="239" font-size="20" font-weight="400" style="fill:#173148">con vigencia</text>
