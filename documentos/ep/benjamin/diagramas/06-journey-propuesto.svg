<text x="1253" y="213" font-size="20" font-weight="400" style="fill:#173148">Acepta expresamente COT</text>
<text x="1253" y="239" font-size="20" font-weight="400" style="fill:#173148">v1</text>
<rect x="1497" y="180" width="253" height="140" rx="4" fill="#f4f7fa"/>
<text x="1510" y="213" font-size="20" font-weight="400" style="fill:#173148">Conoce el estado y</text>
<text x="1510" y="239" font-size="20" font-weight="400" style="fill:#173148">siguiente paso</text>
<text x="47" y="360" font-size="19" font-weight="700" style="fill:#173148">Trabajo interno</text>
