# Agente SIE · PC3 · G7 Importaciones MYS Hermanos (datos sintéticos)
# Uso: cp .env.example .env  →  docker compose up -d  →  ver README.md
name: agente-sie

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    image: odoo:18.0
    init: true   # recoge procesos hijos (curl del healthcheck); Odoo como PID 1 no lo hace
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_RC: /tmp/odoo.conf
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD}
    # Genera la configuración al arrancar para no guardar la clave maestra en un archivo del repositorio.
    entrypoint:
      - /bin/bash
      - -c
      - >-
        printf '[options]\ndata_dir = /var/lib/odoo\nadmin_passwd = %s\nlist_db = True\nproxy_mode = False\nlimit_time_real = 1800\nlimit_time_cpu = 1200\n'
        "$$ODOO_MASTER_PASSWORD" > /tmp/odoo.conf && exec /entrypoint.sh odoo
    volumes:
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  compuerta:
    build: ./compuerta
    depends_on:
      odoo:
        condition: service_healthy
    ports:
      - "${COMPUERTA_PORT:-8000}:8000"
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB}
      ODOO_USER: ${ODOO_USER}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD}
      ODOO_TIMEOUT: "5"
      ODOO_IDIOMA: ${ODOO_IDIOMA:-es_PE}
      TOKEN_VENTAS: ${TOKEN_VENTAS}
      TOKEN_GERENCIA: ${TOKEN_GERENCIA}
      TOKEN_ADMIN: ${TOKEN_ADMIN}
      COTIZACION_HORA_CIERRE: ${COTIZACION_HORA_CIERRE:-18:00}
      COMPUERTA_DB: /data/compuerta.sqlite3
      TZ: America/Lima
    volumes:
      - compuerta-data:/data
      - ./odoo:/seed:ro
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.46.7}
    depends_on:
      compuerta:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/Lima
      TZ: America/Lima
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  odoo-data:
  compuerta-data:
  n8n-data:
