# Plataforma local MYS. Conserva el nombre/volúmenes del agente original.
name: agente-sie

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:?Ejecute python scripts/configurar.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  odoo:
    image: odoo:18.0
    init: true
    depends_on:
      db: {condition: service_healthy}
    ports:
      - '127.0.0.1:${ODOO_PORT:-8069}:8069'
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_RC: /tmp/odoo.conf
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:?Falta clave maestra}
      ODOO_DB: ${ODOO_DB}
      COMPUERTA_URL: http://compuerta:8000
      TOKEN_ODOO: ${TOKEN_ODOO:?Ejecute python scripts/configurar.py}
      ODOO_BRIDGE_SECRET: ${ODOO_BRIDGE_SECRET:?Falta secreto del puente}
      N8N_INTERNAL_URL: http://n8n:5678
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?Falta secreto del webhook}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-models/gemini-3.5-flash}
    entrypoint: [/bin/bash, /opt/mys/iniciar_odoo.sh]
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo/iniciar_odoo.sh:/opt/mys/iniciar_odoo.sh:ro
      - ./odoo/addons:/mnt/extra-addons:ro
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8069/web/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 25
      start_period: 40s
    restart: unless-stopped

  compuerta:
    build: ./agente-sie/compuerta
    init: true
    depends_on:
      odoo: {condition: service_healthy}
    ports:
      - '127.0.0.1:${COMPUERTA_PORT:-8000}:8000'
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB}
      ODOO_USER: ${ODOO_USER}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      ODOO_READER_USER: ${ODOO_READER_USER:-sie-lectura}
      ODOO_READER_PASSWORD: ${ODOO_READER_PASSWORD:?Falta contraseña de integración}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD}
      ODOO_SELLER_PASSWORD: ${ODOO_SELLER_PASSWORD}
      ODOO_OWNER_PASSWORD: ${ODOO_OWNER_PASSWORD}
      ODOO_IDIOMA: ${ODOO_IDIOMA:-es_PE}
      ODOO_TIMEOUT: '8'
      TOKEN_VENTAS: ${TOKEN_VENTAS}
      TOKEN_GERENCIA: ${TOKEN_GERENCIA}
      TOKEN_ADMIN: ${TOKEN_ADMIN}
      TOKEN_ODOO: ${TOKEN_ODOO}
      TOKEN_AGENTE: ${TOKEN_AGENTE}
      ODOO_BRIDGE_SECRET: ${ODOO_BRIDGE_SECRET}
      COTIZACION_HORA_CIERRE: ${COTIZACION_HORA_CIERRE:-23:59}
      COMPUERTA_DB: /data/compuerta.sqlite3
      CATALOGO_PATH: /catalogo/productos_50.json
      PUBLIC_ODOO_URL: http://localhost:${ODOO_PORT:-8069}
      PUBLIC_N8N_URL: http://localhost:${N8N_PORT:-5678}
      TZ: America/Lima
    volumes:
      - compuerta-data:/data
      - ./agente-sie/odoo:/seed:ro
      - ./odoo:/plataforma:ro
      - ./datos:/catalogo:ro
      - ./agente-sie/datos_prueba:/casos:ro
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.46.7}
    init: true
    depends_on:
      compuerta: {condition: service_healthy}
    ports:
      - '127.0.0.1:${N8N_PORT:-5678}:5678'
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/Lima
      TZ: America/Lima
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
    volumes:
      - n8n-data:/home/node/.n8n
      - ./agente-sie/n8n/workflows:/workflows:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:5678/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 25
      start_period: 30s
    restart: unless-stopped

  web:
    image: nginx:1.28-alpine
    depends_on:
      odoo: {condition: service_healthy}
    ports:
      - '127.0.0.1:${APP_PORT:-8088}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1/salud || exit 1']
      interval: 15s
      timeout: 4s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  odoo-data:
  compuerta-data:
  n8n-data:
