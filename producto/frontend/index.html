<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b2432" />
    <meta name="description" content="MVP visual de un ERP comercial inspirado en los módulos de Odoo para el caso MYS Hermanos." />
    <title>MYS ERP · MVP visual</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación principal">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">M</div>
          <div><strong>MYS ERP</strong><small>Prototipo Odoo</small></div>
        </div>
        <div class="workspace-label">ESPACIO DE TRABAJO</div>
        <nav id="main-nav" class="nav-list">
          <button class="nav-item is-active" type="button" data-view="resumen"><span class="nav-icon">◫</span> Resumen</button>
          <button class="nav-item" type="button" data-view="pedidos"><span class="nav-icon">▤</span> Pedidos <span id="nav-pending" class="nav-count">0</span></button>
          <button class="nav-item" type="button" data-view="inventario"><span class="nav-icon">▦</span> Inventario</button>
          <button class="nav-item" type="button" data-view="facturacion"><span class="nav-icon">▣</span> Facturación</button>
          <button class="nav-item" type="button" data-view="canales"><span class="nav-icon">◇</span> Canales</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="demo-card"><span class="demo-dot"></span><div><strong>Modo demostración</strong><small>Datos ficticios · navegador local</small></div></div>
          <button id="reset-demo" class="reset-button" type="button">Restablecer demo</button>
        </div>
      </aside>

      <div class="content-shell">
        <header class="topbar">
          <div class="topbar-left"><button id="menu-toggle" class="mobile-menu" type="button" aria-label="Abrir menú">☰</button><span id="breadcrumb">Operaciones / Resumen</span></div>
          <div class="topbar-right"><span class="topbar-date" id="today-label"></span><span class="divider"></span><span class="avatar" aria-label="Usuario de demostración">G7</span><span class="topbar-user">Grupo 7 <small>Administrador demo</small></span></div>
        </header>
        <main id="view" class="main-content" tabindex="-1"></main>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
